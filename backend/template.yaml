AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Indo Account FastAPI backend

Parameters:
  AllowedOrigins:
    Type: String
    Default: https://indoworkspace.github.io
  OtpFromEmail:
    Type: String
    Default: no-reply@eyemail.in
  OtpHashSecret:
    Type: String
    NoEcho: true
    MinLength: 32

Resources:
  IndoAccountApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: indo-account-api
      CodeUri: .
      Handler: app.main.handler
      Runtime: python3.13
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          DYNAMODB_TABLE: UnifiedAppTable
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          SESSION_DAYS: '30'
          OTP_FROM_EMAIL: !Ref OtpFromEmail
          OTP_HASH_SECRET: !Ref OtpHashSecret
          OTP_TTL_SECONDS: '600'
          OTP_RESEND_SECONDS: '60'
          OTP_VERIFICATION_SECONDS: '900'
          OTP_MAX_ATTEMPTS: '5'
          REQUIRE_SIGNUP_EMAIL_OTP: 'true'
          REQUIRE_SENSITIVE_ACTION_OTP: 'false'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
                - dynamodb:ConditionCheckItem
                - dynamodb:DeleteItem
                - dynamodb:DescribeTable
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
                - dynamodb:UpdateItem
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UnifiedAppTable
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UnifiedAppTable/index/*
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource:
                - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/eyemail.in
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigins
          AllowMethods: [GET, POST, PATCH, DELETE]
          AllowHeaders: [Authorization, Content-Type]

Outputs:
  ApiUrl:
    Description: Indo Account API base URL
    Value: !GetAtt IndoAccountApiUrl.FunctionUrl

