<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Reset password · Indo Account</title><link rel="stylesheet" href="../styles.css?v=20261114-1000"><style>.reset-progress{display:flex;gap:7px;margin:0 0 10px}.reset-progress span{height:6px;flex:1;border-radius:8px;background:#dce2ea}.reset-progress span.active{background:var(--brand)}.reset-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.reset-actions button{margin:0}.reset-actions .primary{width:auto;min-width:130px}.reset-note{padding:11px 13px;border-radius:10px;background:#f5f8fd;color:var(--muted);font-size:13px}.password-rule{display:block;color:var(--muted);font-size:12px;margin-top:5px}@media(max-width:480px){.reset-actions{align-items:stretch;flex-direction:column-reverse}.reset-actions button{width:100%!important}}</style></head><body class="auth-page"><main class="auth-wrap"><section class="card"><header class="auth-head"><div class="brand"><span class="mark">IN</span> Indo Account</div><h1>Reset password</h1><p>Recover your account securely.</p></header><div class="reset-progress" aria-hidden="true"><span class="active"></span><span></span><span></span></div><p id="step-label" class="form-note">Find your account</p>
<section id="identify-step"><form id="identify-form"><div class="field"><label for="identifier">Indo ID, recovery email, or mobile</label><input id="identifier" autocomplete="username" placeholder="name@eyemail.in" required></div><button class="primary">Continue</button></form></section>
<section id="verify-step" class="hidden"><p id="destination" class="reset-note"></p><form id="verify-form"><div class="field"><label for="otp">Verification code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="Enter 6-digit OTP" required></div><button class="primary">Verify code</button></form><div class="reset-actions"><button id="change-identifier" type="button" class="secondary">Change account</button><button id="resend" type="button" class="secondary">Resend code</button></div></section>
<section id="password-step" class="hidden"><form id="password-form"><div class="field"><label for="new-password">New password</label><div class="password-wrap"><input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="64" required><button type="button" class="toggle toggle-password" data-target="#new-password">Show</button></div><small class="password-rule">8–64 characters with uppercase, lowercase, number, and symbol.</small></div><div class="field"><label for="confirm-password">Confirm new password</label><div class="password-wrap"><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="64" required><button type="button" class="toggle toggle-password" data-target="#confirm-password">Show</button></div></div><button class="primary">Update password</button></form></section>
<p id="message" class="error" aria-live="polite"></p><a class="secondary" style="display:block;text-align:center;margin-top:14px" href="../Sign%20in/index.html">Back to sign in</a></section></main><footer class="auth-footer">Indo Account &nbsp; · &nbsp; Privacy &nbsp; · &nbsp; Terms &nbsp; · &nbsp; Help</footer><script type="module" src="forgot-password.js?v=20261114-1000"></script></body></html>
