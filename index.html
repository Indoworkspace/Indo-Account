<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Indo Account</title>
  <link rel="icon" href="assets/branding/indo-mark-32.png">
  <link rel="apple-touch-icon" href="assets/branding/indo-mark-180.png">
</head>
<body>
  <noscript><p>JavaScript is required to open Indo Account. <a href="./Sign%20in/index.html">Continue to sign in</a>.</p></noscript>
  <script>
    (()=>{
      const sessionKey='indo_active_session',databaseKey='indo_unified_app_table';
      let signedIn=false;
      try{
        const userId=localStorage.getItem(sessionKey),database=JSON.parse(localStorage.getItem(databaseKey)||'{"users":[]}');
        const user=Array.isArray(database.users)&&database.users.find(item=>item.user_id===userId),apiToken=sessionStorage.getItem('indo_api_session_token');
        signedIn=Boolean(user&&(!user.remote_managed||apiToken));
        if(userId&&!signedIn)localStorage.removeItem(sessionKey);
      }catch{
        localStorage.removeItem(sessionKey);
      }
      location.replace(signedIn?'./management/index.html':'./Sign%20in/index.html');
    })();
  </script>
</body>
</html>
